<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>选择器</title>
        <style>
                /* 通配符选择器 */
                * {
                        margin: 0;
                        padding: 0;
                }

                /* 元素选择器 */
                body {
                        background-color: rgb(186, 241, 222);
                        /* 配合后续伪元素选择器 */
                        /* 设置计数器名字为mycounter，默认从1开始 */
                        counter-reset: mycounter;
                }

                /* 群组选择器 */
                h1,
                h2,
                h3,
                h4,
                h5,
                h6 {
                        font-size: 200%;
                        text-align: center;
                }

                /* 类选择器 */
                .wrapper {
                        margin: 0 auto;
                        /* 设置固定宽高，后续使用fr单位 */
                        width: 300px;
                        height: 300px;
                        /* 设置grid布局 */
                        display: grid;
                        /* 
                        repeat(重复次数，每次占据剩余空间的大小) 
                        */
                        grid-template-columns: repeat(3, 1fr);
                        gap: 5px;
                        background-color: red;
                }

                /* 类选择器 */
                .box {
                        /* 设置水平垂直居中 */
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        background-color: rgb(183, 140, 229);
                }

              

                /* 将第三个div通过子元素选择器 设置 背景色 为 粉色 */
                .wrapper > .box:nth-child(3){
                    background-color: pink;
                }

                /* 将最后一个div通过子元素选择器  设置背景色为 红色 */



        </style>
</head>

<body>
        <h1>属性选择器</h1>
        <div class="wrapper">
                <div class="box" id="one"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box" title="center"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box counter"></div>
        </div>
</body>

</html>
