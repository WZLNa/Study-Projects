<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="UTF-8">
        <title>3.1 列表</title>
        <style>
            .fruit{
                /* 去掉无序列表前的圆点 */
                list-style-type: none;
                display: flex;
            }
            .fruit li{
                width: 150px;
                height: 60px;
                border-right: 1px soild #ccc;
                text-align: center;
                line-height: 60px;
                background-color: #ccc;
            }
        </style>
    </head>
    <body>
        <!-- 无序列表 -->
        <ul class="fruit">
            <li>苹果</li>
            <li>苹果2</li>
            <li>苹果3</li>
            <li>苹果4</li>
        </ul>

         <!-- 有序列表 -->
        <ol class="fruit">
            <li>苹果</li>
            <li>苹果2</li>
            <li>苹果3</li>
            <li>苹果4</li>
        </ol>

        <!-- 列表嵌套 -->
         <ul>
            <li>
                软件工程系
                <ul>
                    <li>软件技术</li>
                    <li>大数据技术</li>
                    <li>人工智能技术</li>
                </ul>
            </li>
            <li>
                互联网商务系
                <ul>
                    <li>电子商务</li>
                    <li>网络营销</li>
                    <li>电子商务技术</li>
            </li>
            <li>数字传媒系</li>
         </ul>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
