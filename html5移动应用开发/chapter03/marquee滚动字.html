<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- jQuery Marquee -->
    <script src="https://unpkg.com/jquery.marquee@1.5.0/jquery.marquee.min.js"></script>
</head>

<body>
    <div class="marquee">
        <p>这是滚动的文字</p>
    </div>
</body>
<script>
    $(document).ready(function () {
        $(".marquee").marquee({
            direction:"left",
            speed:100,
            gap:"10px",
            start:"onload"
        });
    });
</script>

</html>
