<html lang="zh-cn">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Document</title>
        <style>
            body{
                background-color: #ccc;
            }
            .menu{
                width:544px;
                height:117px;
                background-color: white;
                border-radius:7px;
                overflow:hidden;  /*超出范围的元素隐藏*/
                display:flex;
                flex-wrap:wrap;
            }
            .item{
                width:108px;
                height:58px;
                display:flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .item img{
                width:28px;
                height:28px;
                margin: item 3px;
            }

            .item:nth-child(1) div,
            .item:nth-child(2) div,
            .item:nth-child(3) div,
            .item:nth-child(4) div,
            .item:nth-child(5) div{
                color:white;
            }

            .item:first-child{
                background-image: linear-gradient(180deg, #FA5956 0%, #FB8650 100%);
            }
            .item:nth-child(2){
                background-image: linear-gradient(180deg, #3C83FA 0%, #50B2FA 100%);
            }
            .item:nth-child(3){
                background-image: linear-gradient(0deg, #66A4FF 0%, #5E80FF 100%);
            }
            .item:nth-child(4){
                background-image: linear-gradient(180deg, #2FC3B6 0%, #52D9B3 100%);
            }
            .item:nth-child(5){
                background-image: linear-gradient(0deg, #FFA846 0%, #FF8939 99%);
            }
            .item:nth-child(6){
                background-color: #fff5f1;
            }
            .item:nth-child(7){
                background-color: #eff9ff;
            }
            .item:nth-child(8){
                background-color: #f2f5ff;
            }
            .item:nth-child(9){
                background-color: #ecfcf8;
            }
            .item:nth-child(10){
                background-color: #fff9f2;
            }
            
        </style>
    </head>
    <body>
        <div class="menu">
            <div class="item">
                <img src="images/hotel.fc17d0f7726132bf2459621923704f0f.png" alt="酒店">
                <div>酒店</div>
            </div>
            <div class="item">
                <img src="images/flight.2af1e1835a10709db9ad91702e30de35.png" alt="酒店">
                <div>机票</div>
            </div>
            <div class="item">
                <img src="images/train_ticket.62fc76e6f4ffac3d2e4610c807f535bb.png" alt="酒店">
                <div>火车票</div>
            </div>
            <div class="item">
                <img src="images/vacation.50ea6db60ea69086791ea507b62364bb.png" alt="酒店">
                <div>旅游</div>
            </div>
            <div class="item">
                <img src="images/gs.24c525633ba91ad0a2c41ff96773262b.png" alt="酒店">
                <div>攻略/景点</div>
            </div>
            <div class="item">
                <img src="images/hotel.fc17d0f7726132bf2459621923704f0f.png" alt="酒店">
                <div>民俗/客栈</div>
            </div>
            <div class="item">
                <img src="images/hotel.fc17d0f7726132bf2459621923704f0f.png" alt="酒店">
                <div>航班助手</div>
            </div>
            <div class="item">
                <img src="images/hotel.fc17d0f7726132bf2459621923704f0f.png" alt="酒店">
                <div>汽车/船票</div>
            </div>
            <div class="item">
