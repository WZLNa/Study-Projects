<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="UTF-8">
        <title>河软大事记2025</title>
        <style>
            .zhengwen {
                text-indent: 2em;
                font-size: 26px;
                line-height: 26px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center;color:red;">河软大事记(2025)</h1>
        <p style="text-align: center;">发布时间：2026-01-05 作者： 点击：130</p>
        <p style="text-decoration: underline;text-align: center;font-size: 60px;">【一月】</p>
        <p class="zhengwen">
            1月2日至10日，为深入贯彻党的二十届三中全会精神，扎实推进访企拓岗促就业专项行动，党委书记、院长马志峰带队赴北京、石家庄、雄安新区、廊坊等地开展访企拓岗工作。
        </p>
        <p class="zhengwen">
            1月6日，共青团河北省委公布了2024年度河北省共青团改革工作典型案例评审结果，我校《河北软件学院团委：打造“寻星炬火”实践思政课堂新范式》案例入选。
        </p>
        <p class="zhengwen">
            1月26日，巴音郭楞职业技术学院向我校发来感谢信，对我校在对口援疆工作中给予的支持与帮助表示感谢。
        </p>
    </body>
</html>
