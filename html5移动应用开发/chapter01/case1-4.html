<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h4 { width:100px; height:100px; background-color: red; display:inline }
        img { width:100px; height:100px; background-color: blue; display:none }
        p { width:100px; height:100px; background-color: pink;display:block }
        a{ width:100px; height:100px; background-color: green; }
        span { width:100px; height:100px; background-color: yellow; }
    </style>
</head>
<body>
    <!--
    1.元素（标签）的类型
        (1)都有哪些元素？
        行内元素：不独占一行的元素，不能设置宽和高 （a、span、img等）
        块级元素：独占一行的元素，可以设置宽和高（h4、p)
        行内块元素：不独占一行的元素，可以设置宽和高（input img）
        (2)元素类型转换
        display:inline 将当前元素转换为行内元素
        display:block 将当前元素转换为块级元素
        display:inline-block 将当前元素转换为行内块元素
        display:none 将当前元素隐藏
    2.盒子模型
    3.浮动和定位
    -->
    <h4>标题</h4>
    <img src="https://www.wzln.top/beijing.jpg" alt="" width="400px" height="300px">
    <p>这是一段文字</p>
    <a href="https://www.wzln.top">这是一个链接</a>
    <span>你好 我是span</span>
</body>
</html>
